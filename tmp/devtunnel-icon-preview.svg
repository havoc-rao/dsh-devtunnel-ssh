<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Dev Tunnel · subtle cloud-link refinement</title>
<desc id="desc">Original chain alongside two subtly cloud-shaped link variants, enlarged and at toolbar size.</desc>
<defs>
  <g id="chain" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 10.5l3-3M5.5 9.5l-1 1a2.12 2.12 0 0 1-3-3l3-3a2.12 2.12 0 0 1 3 0M8.5 6.5l1-1a2.12 2.12 0 0 1 3 3l-3 3a2.12 2.12 0 0 1-3 0"/>
  </g>
  <!-- Keep the diagonal link; soften only its upper outer contour. -->
  <g id="soft-cloud" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.1 7.2C2.7 4.8 4.6 2.5 7 3.4C7.8 1.2 10.3.6 12 2.1C13.8 3.6 13.6 5.7 12 7.3L9.5 9.8C8.3 11 6.9 10.8 5.9 9.7"/>
    <path d="M8.6 7.5C7.5 6.3 6.1 6.3 5 7.4L2 10.4C.8 11.6.8 13.1 2 14.2C3.1 15.3 4.6 15.3 5.8 14.1L8.4 11.5"/>
  </g>
  <!-- A clearer cloud shoulder, without adding a separate symbol. -->
  <g id="cloud-link" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.2C.9 7.2 2 4.8 4.4 4.5C4.1 2.5 5.5 1 7.4 1C9 1 10.2 2 10.6 3.3C12.4 2.6 14.1 3.8 14.1 5.6C14.1 6.6 13.6 7.4 12.8 8.1L10.1 10.2C8.8 11.2 7.4 10.8 6.5 9.8"/>
    <path d="M9 7.6C7.9 6.4 6.5 6.4 5.4 7.5L2.5 10.4C1.3 11.6 1.3 13.1 2.5 14.2C3.6 15.3 5.1 15.3 6.3 14.1L8.8 11.6"/>
  </g>
  <g id="status"><circle cx="16" cy="16" r="2" fill="#22c55e" stroke="#171717" stroke-width="1.2"/></g>
</defs>
<path fill="#171717" d="M0 0h900v360H0z"/>
<g fill="#aaa" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">
  <text x="150" y="40">A · Original</text>
  <text x="450" y="40">B · Soft cloud</text>
  <text x="750" y="40">C · Cloud link</text>
</g>
<g color="#e8e8e8">
  <g transform="translate(110 88) scale(5)"><use href="#chain"/><use href="#status"/></g>
  <g transform="translate(410 88) scale(5)"><use href="#soft-cloud"/><use href="#status"/></g>
  <g transform="translate(710 88) scale(5)"><use href="#cloud-link"/><use href="#status"/></g>
  <g transform="translate(142 250)"><use href="#chain"/><use href="#status"/></g>
  <g transform="translate(442 250)"><use href="#soft-cloud"/><use href="#status"/></g>
  <g transform="translate(742 250)"><use href="#cloud-link"/><use href="#status"/></g>
</g>
<g fill="#777" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
  <text x="450" y="310">Actual toolbar scale · icon only · status badge</text>
</g>
</svg>
